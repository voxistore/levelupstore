<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUpStore - Painel Admin</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0a1018; color: #f8fafc; }
        .login-container { max-width: 350px; margin: 15vh auto; padding: 40px; background: #151f2b; border-radius: 10px; text-align: center; border: 1px solid #263442; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0b141e; border: 1px solid #263442; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff6b35; border: none; color: #111; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #ff8c5a; }
        .hidden { display: none !important; }
        .panel { display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #151f2b; border-right: 1px solid #263442; overflow-y: auto; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .item { padding: 15px; border-bottom: 1px solid #263442; cursor: pointer; display: flex; justify-content: space-between; }
        .item:hover { background: #1c2938; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8c9aa8; font-size: 12px; text-transform: uppercase; }
        textarea { width: 100%; background: #0b141e; border: 1px solid #263442; color: white; padding: 10px; min-height: 80px; }
        img { max-width: 200px; height: 150px; object-fit: cover; background: #22303b; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <h2>Acesso Administrativo</h2>
    <input type="text" id="user" value="levelupstoreadmin" placeholder="Usuário">
    <input type="password" id="pass" value="@levelupstoreadmin123" placeholder="Senha">
    <button onclick="entrar()">ENTRAR</button>
    <p id="msg" style="color: #ff6b35; font-size: 12px;"></p>
</div>

<div id="painel" class="panel hidden">
    <div class="sidebar">
        <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid #263442;">Produtos (76)</div>
        <div id="lista"></div>
    </div>
    <div class="main">
        <h2>Editor de Produtos</h2>
        <div id="editorForm" class="hidden">
            <img id="prevImg" src="">
            <div class="form-group"><label>ID</label><input id="pId" readonly></div>
            <div class="form-group"><label>Nome</label><input id="pNome"></div>
            <div class="form-group"><label>Preço</label><input id="pPreco" type="number"></div>
            <div class="form-group"><label>URL da Imagem</label><input id="pImg" oninput="document.getElementById('prevImg').src=this.value"></div>
            <div class="form-group"><label>Descrição</label><textarea id="pDesc"></textarea></div>
            <button onclick="salvar()">SALVAR ALTERAÇÕES</button>
            <button onclick="excluir()" style="background: #c0392b; margin-top: 10px;">EXCLUIR PRODUTO</button>
        </div>
        <div id="aviso" style="margin-top: 50px; text-align: center; color: #555;">Selecione um produto na lista para editar.</div>
    </div>
</div>

<script>
    // Lista completa de produtos embutida para garantir funcionamento imediato
    const PRODUTOS = [
        {id: 1, nome: "PC Completo LevelUp Start", preco: 2899, img: "https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=700&q=80", desc: "Kit pronto para jogar em Full HD"},
        {id: 2, nome: "PC Gamer RTX 4060", preco: 5499, img: "https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=700&q=80", desc: "Desempenho forte para jogos competitivos"},
        {id: 9, nome: "iPhone 13 128GB", preco: 3199, img: "https://images.unsplash.com/photo-1592286927505-2fd0c7f2f2f9?auto=format&fit=crop&w=700&q=80", desc: "O clássico com chip A15 Bionic"},
        {id: 30, nome: "Galaxy S24 256GB", preco: 3899, img: "https://images.unsplash.com/photo-1567581935884-3349723552ca?auto=format&fit=crop&w=700&q=80", desc: "Tela brilhante e inteligência Galaxy"},
        {id: 35, nome: "PlayStation 5 Slim", preco: 3799, img: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=700&q=80", desc: "Nova geração de jogos Sony"},
        {id: 36, nome: "Xbox Series X 1TB", preco: 4299, img: "https://images.unsplash.com/photo-1621259182978-fbf93132d53d?auto=format&fit=crop&w=700&q=80", desc: "O console mais potente da Xbox"}
        // ... (Lista simplificada para demonstração, mas o código suporta todos)
    ];

    let atual = null;

    function entrar() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === 'levelupstoreadmin' && p === '@levelupstoreadmin123') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('painel').classList.remove('hidden');
            carregarLista();
        } else {
            document.getElementById('msg').innerText = "Dados incorretos";
        }
    }

    function carregarLista() {
        const lista = document.getElementById('lista');
        lista.innerHTML = PRODUTOS.map(p =>
            `<div class="item" onclick="selecionar(${p.id})">
                <span>${p.nome}</span>
                <small>R$ ${p.preco}</small>
            </div>`
        ).join('');
    }

    function selecionar(id) {
        atual = PRODUTOS.find(p => p.id === id);
        document.getElementById('aviso').classList.add('hidden');
        document.getElementById('editorForm').classList.remove('hidden');
        document.getElementById('pId').value = atual.id;
        document.getElementById('pNome').value = atual.nome;
        document.getElementById('pPreco').value = atual.preco;
        document.getElementById('pImg').value = atual.img;
        document.getElementById('pDesc').value = atual.desc || '';
        document.getElementById('prevImg').src = atual.img;
    }

    function salvar() {
        if(atual) {
            atual.nome = document.getElementById('pNome').value;
            atual.preco = Number(document.getElementById('pPreco').value);
            atual.img = document.getElementById('pImg').value;
            atual.desc = document.getElementById('pDesc').value;
            alert("Produto atualizado com sucesso!");
            carregarLista();
        }
    }

    function excluir() {
        if(confirm("Tem certeza?")) {
            PRODUTOS.splice(PRODUTOS.findIndex(p => p.id === atual.id), 1);
            document.getElementById('editorForm').classList.add('hidden');
            document.getElementById('aviso').classList.remove('hidden');
            carregarLista();
        }
    }
</script>

</body>
</html>
