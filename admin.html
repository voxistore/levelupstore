<!DOCTYPE html>
<html lang="pt-BR">
<head>
<Anthropic charset="UTF-8" />
<Anthropic name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LevelUpStore | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0a1018;--panel:#151f2b;--line:#263442;--ink:#f8fafc;--orange:#ff6b35}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:sans-serif}
  .login-box{max-width:340px;margin:10vh auto;padding:30px;background:var(--panel);border:1px solid var(--line);text-align:center;border-radius:8px}
  input,select,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid var(--line);background:#0b141e;color:#fff;font-size:14px;border-radius:4px}
  button{width:100%;padding:12px;margin-top:15px;background:var(--orange);border:none;color:#111;font-weight:bold;font-size:14px;cursor:pointer;border-radius:4px;transition:0.2s}
  button:hover{background:#ff8c5a}
  .hidden{display:none!important}
  .main-layout{display:flex;height:100vh}
  .sidebar{width:320px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .sidebar-header{padding:15px;border-bottom:1px solid var(--line)}
  .product-list{flex:1;overflow-y:auto}
  .product-item{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .product-item:hover,.product-item.active{background:#1c2938}
  .product-item small{color:var(--orange);font-weight:bold}
  .editor{flex:1;padding:30px 40px;overflow-y:auto}
  .tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .tab-btn{width:auto;padding:8px 16px;background:transparent;color:#8c9aa8;border:1px solid var(--line);margin:0}
  .tab-btn.active{background:var(--orange);color:#111;border-color:var(--orange)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  img.preview{max-width:200px;height:140px;object-fit:cover;background:#22303b;margin-bottom:15px;border-radius:4px;border:1px solid var(--line)}
  label{display:block;margin-top:12px;color:#8c9aa8;font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:20px}
  .category-card{background:#0b141e;border:1px solid var(--line);padding:15px;border-radius:6px}
  .category-card img{width:100%;height:120px;object-fit:cover;border-radius:4px;margin-bottom:10px}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen" class="login-box">
  <h2 style="text-transform:uppercase;margin:0 0 5px;color:#fff">Painel Admin</h2>
  <p style="color:#8c9aa8;font-size:12px;margin:0 0 20px">LevelUpStore Control</p>
  <input type="text" id="user" value="levelupstoreadmin" placeholder="Usuário">
  <input type="password" id="pass" value="@levelupstoreadmin123" placeholder="Senha">
  <button type="button" onclick="doLogin()">ENTRAR NO PAINEL</button>
  <p id="error" style="color:#ff6b35;font-size:12px;margin-top:10px"></p>
</div>

<!-- PAINEL PRINCIPAL -->
<div id="adminPanel" class="main-layout hidden">
  <div class="sidebar">
    <div class="sidebar-header">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <strong id="prodCount">Produtos (0)</strong>
        <a href="index.html" target="_blank" style="color:var(--orange);font-size:12px;text-decoration:none">Ver Loja ↗</a>
      </div>
      <input type="text" id="search" placeholder="Buscar por nome ou categoria..." oninput="renderList()">
    </div>
    <div id="list" class="product-list"></div>
  </div>

  <div class="editor">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('products')">Gerenciar Produtos</button>
      <button class="tab-btn" onclick="switchTab('categories')">Fotos das Categorias</button>
    </div>

    <!-- ABA PRODUTOS -->
    <div id="tabProducts">
      <div id="emptyState" style="text-align:center;margin-top:15vh;color:#555">
        Selecione um produto na barra lateral para editar suas informações ou fotos.
      </div>
      <form id="editForm" class="hidden" onsubmit="saveProduct(event)">
        <img id="preview" class="preview" src="">

        <div class="grid-2">
          <div>
            <label>ID do Produto</label>
            <input id="p_id" readonly style="opacity:0.5">
          </div>
          <div>
            <label>Categoria</label>
            <select id="p_cat">
              <option value="pc">PC Gamer</option>
              <option value="hardware">Hardware / Monitores</option>
              <option value="mobile">Celulares (Apple/Samsung/Xiaomi)</option>
              <option value="audio">Áudio (JBL / AirPods)</option>
              <option value="wearable">Wearables / Smartwatches</option>
              <option value="gamer">Cadeiras & Periféricos</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Nome do Produto</label>
            <input id="p_name" required>
          </div>
          <div>
            <label>Etiqueta / Badge</label>
            <input id="p_badge" placeholder="Ex: Apple, Novo, Promoção">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Preço à vista (R$)</label>
            <input id="p_price" type="number" step="0.01" required>
          </div>
          <div>
            <label>Detalhes rápidos</label>
            <input id="p_detail" placeholder="Ex: 256GB · 5G · AMOLED">
          </div>
        </div>

        <label>URL da Imagem</label>
        <input id="p_image" required oninput="document.getElementById('preview').src=this.value">

        <label>Descrição Completa</label>
        <textarea id="p_desc" rows="3"></textarea>

        <button type="submit">SALVAR ALTERAÇÕES</button>
        <button type="button" onclick="deleteProduct()" style="background:#c0392b;color:#fff;margin-top:10px">EXCLUIR ESTE PRODUTO</button>
      </form>
    </div>

    <!-- ABA CATEGORIAS -->
    <div id="tabCategories" class="hidden">
      <h3 style="margin-top:0">Personalizar Imagens das Categorias</h3>
      <p style="color:#8c9aa8;font-size:13px;margin-bottom:20px">Altere as fotos exibidas nos cards da página inicial.</p>
      <div id="categoryCards" class="category-grid"></div>
    </div>

  </div>
</div>

async function initAdmin() {
  // Inicializa com a lista de 76 produtos embutida
  allProducts = [...BASE_PRODUCTS];

  // Tenta puxar alterações salvas no Supabase
  if (supabase) {
    try {
      const { data } = await supabase.from('products_edits').select('*');
      if (data && data.length > 0) {
        data.forEach(edit => {
          if (edit.deleted) {
            allProducts = allProducts.filter(p => p.id !== edit.id);
          } else {
            const index = allProducts.findIndex(p => p.id === edit.id);
            if (index !== -1) Object.assign(allProducts[index], edit);
            else allProducts.push(edit);
          }
        });
      }
    } catch (e) {
      console.warn('Erro ao carregar edições do Supabase:', e);
    }
  }

  renderList();
  renderCategoryGrid();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (tab === 'products') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tabProducts').classList.remove('hidden');
    document.getElementById('tabCategories').classList.add('hidden');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tabProducts').classList.add('hidden');
    document.getElementById('tabCategories').classList.remove('hidden');
  }
}

function renderList() {
  const term = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(term) ||
    (p.badge && p.badge.toLowerCase().includes(term)) ||
    (p.category && p.category.toLowerCase().includes(term))
  );

  document.getElementById('prodCount').innerText = `Produtos (${filtered.length})`;
  list.innerHTML = filtered.map(p => `
    <div class="product-item ${currentId === p.id ? 'active' : ''}" onclick="selectProduct(${p.id})">
      <div>
        <div><strong>${p.name}</strong></div>
        <div style="font-size:11px;color:#8c9aa8">${p.badge || p.category}</div>
      </div>
      <small>R$ ${Number(p.price || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</small>
    </div>
  `).join('');
}

function selectProduct(id) {
  currentId = id;
  const p = allProducts.find(x => x.id === id);
  if (!p) return;

  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('editForm').classList.remove('hidden');

  document.getElementById('p_id').value = p.id;
  document.getElementById('p_name').value = p.name || '';
  document.getElementById('p_cat').value = p.category || 'pc';
  document.getElementById('p_badge').value = p.badge || '';
  document.getElementById('p_price').value = p.price || 0;
  document.getElementById('p_detail').value = p.detail || '';
  document.getElementById('p_image').value = p.image || '';
  document.getElementById('p_desc').value = p.description || '';
  document.getElementById('preview').src = p.image || '';

  renderList();
}

async function saveProduct(e) {
  e.preventDefault();
  const id = Number(document.getElementById('p_id').value);
  const updates = {
    id: id,
    name: document.getElementById('p_name').value,
    category: document.getElementById('p_cat').value,
    badge: document.getElementById('p_badge').value,
    price: Number(document.getElementById('p_price').value),
    detail: document.getElementById('p_detail').value,
    image: document.getElementById('p_image').value,
    description: document.getElementById('p_desc').value
  };

  const index = allProducts.findIndex(p => p.id === id);
  if (index !== -1) {
    Object.assign(allProducts[index], updates);
  }

  if (supabase) {
    await supabase.from('products_edits').upsert(updates);
  }

  alert('Alterações salvas com sucesso!');
  renderList();
}

async function deleteProduct() {
  if (!confirm('Deseja realmente excluir este produto?')) return;

  if (supabase) {
    await supabase.from('products_edits').upsert({ id: currentId, deleted: true });
  }

  allProducts = allProducts.filter(p => p.id !== currentId);
  currentId = null;
  document.getElementById('editForm').classList.add('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  renderList();
  alert('Produto excluído com sucesso!');
}

function renderCategoryGrid() {
  const container = document.getElementById('categoryCards');
  const savedImages = JSON.parse(localStorage.getItem('levelup-category-images') || '{}');

  container.innerHTML = CATEGORIES.map(cat => {
    const currentImg = savedImages[cat.key] || cat.defaultImg;
    return `
      <div class="category-card">
        <img id="cat_prev_${cat.key}" src="${currentImg}">
        <strong>${cat.name}</strong>
        <label>URL da Imagem</label>
        <input id="cat_input_${cat.key}" value="${currentImg}" oninput="document.getElementById('cat_prev_${cat.key}').src=this.value">
        <button type="button" onclick="saveCategoryImg('${cat.key}')">Salvar Foto de Capa</button>
      </div>
    `;
  }).join('');
}

function saveCategoryImg(key) {
  const url = document.getElementById(`cat_input_${key}`).value.trim();
  const saved = JSON.parse(localStorage.getItem('levelup-category-images') || '{}');
  saved[key] = url;
  localStorage.setItem('levelup-category-images', JSON.stringify(saved));
  alert('Foto da categoria atualizada!');
}
