<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LevelUpStore | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a1018;--panel:#151f2b;--line:#263442;--ink:#f8fafc;--orange:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:sans-serif}.login-box{max-width:320px;margin:10vh auto;padding:30px;background:var(--panel);border:1px solid var(--line)}input,button{width:100%;padding:10px;margin-top:10px;border:1px solid var(--line);background:#0b141e;color:#fff}button{background:var(--orange);border:0;font-weight:bold;cursor:pointer}.hidden{display:none}.main-layout{display:flex;height:100vh}.sidebar{width:300px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}.editor{flex:1;padding:40px}.product-item{padding:10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between}.product-item:hover,.product-item.active{background:#1c2938}.form-group{margin-bottom:15px}label{display:block;margin-bottom:5px;font-size:12px;color:#8c9aa8}img.preview{max-width:200px;height:150px;object-fit:cover;background:#22303b}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen" class="login-box">
<h2>Painel Admin</h2>
<input type="text" id="user" placeholder="Usuário" value="levelupstoreadmin">
<input type="password" id="pass" placeholder="Senha" value="@levelupstoreadmin123">
<button onclick="doLogin()">ENTRAR</button>
<p id="error" style="color:red;font-size:12px"></p>
</div>

<!-- PAINEL PRINCIPAL -->
<div id="adminPanel" class="main-layout hidden">
<div class="sidebar">
<div style="padding:20px;border-bottom:1px solid var(--line)">
<strong>Produtos</strong>
<input type="text" id="search" placeholder="Buscar..." oninput="renderList()">
</div>
<div id="list"></div>
</div>
<div class="editor">
<div id="emptyState" style="text-align:center;margin-top:20vh;color:#555">Selecione um produto para editar</div>
<form id="editForm" class="hidden" onsubmit="saveProduct(event)">
<img id="preview" class="preview" src="">
<div class="form-group"><label>ID</label><input id="p_id" readonly></div>
<div class="form-group"><label>Nome</label><input id="p_name" required></div>
<div class="form-group"><label>Preço</label><input id="p_price" type="number" step="0.01" required></div>
<div class="form-group"><label>URL da Imagem</label><input id="p_image" required onchange="document.getElementById('preview').src=this.value"></div>
<div class="form-group"><label>Descrição</label><textarea id="p_desc" rows="3" style="width:100%;background:#0b141e;color:#fff;border:1px solid var(--line)"></textarea></div>
<button type="submit">SALVAR ALTERAÇÕES</button>
<button type="button" onclick="deleteProduct()" style="background:#c0392b;margin-top:10px">EXCLUIR PRODUTO</button>
</form>
</div>
</div>

<script>
// CONFIGURAÇÃO SUPABASE
const SUPABASE_URL = 'https://tylrkakismpicnpzjiks.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EYEc-ZTzObs27HrBJ_kdFg_xhEY9bHc';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allProducts = [];
let currentId = null;

// LOGIN SIMPLES
function doLogin() {
const u = document.getElementById('user').value;
const p = document.getElementById('pass').value;
if(u === 'levelupstoreadmin' && p === '@levelupstoreadmin123') {
document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('adminPanel').classList.remove('hidden');
loadProducts();
} else {
document.getElementById('error').innerText = 'Dados incorretos';
}
}

// CARREGAR DADOS
async function loadProducts() {
// Tenta pegar do Supabase, se falhar usa lista vazia
const { data } = await supabase.from('products_edits').select('*');
if(data) allProducts = data;
renderList();
}

// LISTAR PRODUTOS
function renderList() {
const term = document.getElementById('search').value.toLowerCase();
const list = document.getElementById('list');
list.innerHTML = allProducts
.filter(p => p.name.toLowerCase().includes(term))
.map(p => `<div class="product-item ${currentId===p.id?'active':''}" onclick="selectProduct(${p.id})">
<span>${p.name}</span><small>R$ ${Number(p.price).toFixed(2)}</small></div>`).join('');
}

// SELECIONAR PARA EDITAR
function selectProduct(id) {
currentId = id;
const p = allProducts.find(x => x.id === id);
if(!p) return;
document.getElementById('emptyState').classList.add('hidden');
document.getElementById('editForm').classList.remove('hidden');
document.getElementById('p_id').value = p.id;
document.getElementById('p_name').value = p.name;
document.getElementById('p_price').value = p.price;
document.getElementById('p_image').value = p.image || '';
document.getElementById('p_desc').value = p.description || '';
document.getElementById('preview').src = p.image || '';
renderList();
}

// SALVAR NO BANCO
async function saveProduct(e) {
e.preventDefault();
const updates = {
id: Number(document.getElementById('p_id').value),
name: document.getElementById('p_name').value,
price: Number(document.getElementById('p_price').value),
image: document.getElementById('p_image').value,
description: document.getElementById('p_desc').value
};
await supabase.from('products_edits').upsert(updates);
alert('Salvo com sucesso!');
loadProducts(); // Recarrega a lista
}

// EXCLUIR
async function deleteProduct() {
if(!confirm('Tem certeza?')) return;
await supabase.from('products_edits').delete().eq('id', currentId);
currentId = null;
document.getElementById('editForm').classList.add('hidden');
document.getElementById('emptyState').classList.remove('hidden');
loadProducts();
}
</script>
</body>
</html>
